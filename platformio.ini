[env:ttgo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_ENABLED=0
  -DCONFIG_BLUEDROID_ENABLED=0
lib_deps =
  bogde/HX711
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library

